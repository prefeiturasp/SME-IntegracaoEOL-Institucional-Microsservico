services:
  institucional:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: sme_sgp_ms_institucional_dev
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      URL_KEYDB: ${URL_KEYDB:-redis://keydb:6379/0}
    depends_on:
      - keydb
    volumes:
      - .:/app
    command: >
      python -Xfrozen_modules=off -m debugpy
      --listen 0.0.0.0:5679 manage.py runserver 0.0.0.0:8002
    ports:
      - "${PORT_WEB:-8002}:${PORT_WEB:-8002}"
      - "${PORT_DEBUGPY:-5679}:${PORT_DEBUGPY:-5679}"
    restart: unless-stopped

  keydb:
    image: eqalpha/keydb:latest
    platform: linux/amd64
    command: keydb-server --appendonly no --save ""
    restart: unless-stopped